name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore PaymentLedger.slnx

      - name: Check formatting
        run: >
          dotnet format PaymentLedger.slnx --verify-no-changes --no-restore
          --exclude src/PaymentLedger.Infrastructure/Persistence/Migrations

      - name: Build
        run: dotnet build PaymentLedger.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test --project tests/PaymentLedger.UnitTests --no-build --configuration Release

      - name: Integration tests
        run: dotnet test --project tests/PaymentLedger.IntegrationTests --no-build --configuration Release

  images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build
